name: Paper Trail data pull

# Phase 1 of Paper Trail: pulls the raw MFL (2021-24) and Sleeper (2025+) transaction logs into pipeline/history/paper/.
# Manual only. The commit carries [skip ci] so it does not rebuild the site.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pull:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: Pull transaction logs
        run: node pipeline/history/paper_pull.mjs
        env: { PAPER_MFL: '1' }
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pipeline/history/paper
          git diff --cached --quiet && exit 0
          git commit -m "Paper Trail raw transaction data [skip ci]"
          for i in 1 2 3; do git pull --rebase -X theirs && git push && break; sleep 5; done
