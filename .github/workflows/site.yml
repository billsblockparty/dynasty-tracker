name: Build and publish site

on:
  workflow_dispatch:
    inputs:
      mode:
        description: weekly (pull completed week + rebuild), live (scores now), build (no network)
        default: weekly
        type: choice
        options: [weekly, live, build, history]
  push:
    branches: [main]
    paths: ['pipeline/**', '.github/workflows/**', '.github/live-trigger']
  schedule:
    # weekly refresh, Tuesday morning after Monday night (06:17 / 11:17 ET), second run as a backstop
    - cron: '17 10 * * 2'
    - cron: '17 15 * * 2'
    # live scores every 10 minutes during game windows (UTC; covers both EDT and EST)
    - cron: '*/10 0-5 * * 5'      # Thursday night
    - cron: '*/10 13-23 * * 0'    # Sunday
    - cron: '*/10 0-5 * * 1'      # Sunday night
    - cron: '*/10 0-5 * * 2'      # Monday night
    - cron: '*/10 17-23 * 12 6'   # December Saturdays
    - cron: '*/10 0-5 * 12 0'     # December Saturday nights
    - cron: '*/10 16-23 * 11 4'     # Thanksgiving Thursday daytime games (November Thursdays)
    - cron: '*/10 17-23 * 11,12 5'  # Friday games (Black Friday, Christmas on a Friday)
    - cron: '*/10 0-5 * 11,12 6'    # Friday night games
    - cron: '*/10 17-23 * 12 3'     # Christmas on a Wednesday
    - cron: '*/10 0-5 * 12 4'       # Christmas Wednesday night

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: site
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Install
        working-directory: pipeline
        run: |
          pip install numpy pillow
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Team logos
        continue-on-error: true
        run: python3 pipeline/fetch_avatars.py
      - name: Past seasons cache
        # the 2025 tracker (year switch) is rebuilt only when the code or the 2025 capture changes
        uses: actions/cache@v4
        with:
          path: archive
          key: past-v1-${{ hashFiles('pipeline/*.py', 'pipeline/*.mjs', 'pipeline/gen.js', 'pipeline/new_tail.js', 'pipeline/new_head.html', 'pipeline/readability.css', 'pipeline/logos/**', 'pipeline/history/raw/**', 'pipeline/package-lock.json') }}
      - name: Pick mode
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then m="${{ inputs.mode }}";
          elif [ "${{ github.event_name }}" = "push" ]; then m=weekly; [ -f .github/selftest ] && m=selftest; [ -f .github/live-trigger ] && m=live;
          elif [ "${{ github.event.schedule }}" = "17 10 * * 2" ] || [ "${{ github.event.schedule }}" = "17 15 * * 2" ]; then m=weekly;
          else m=live; fi
          echo "mode=$m" >> "$GITHUB_OUTPUT"; echo "Mode: $m"
      - name: FantasyPros cache
        uses: actions/cache@v4
        with:
          path: pipeline/fp
          key: fp-${{ github.run_id }}
          restore-keys: fp-
      - name: FantasyPros projections (second opinion for the pre-game sim; skipped without FP_API_KEY)
        continue-on-error: true
        env:
          FP_API_KEY: ${{ secrets.FP_API_KEY }}
        run: |
          python3 pipeline/fp_pull.py
      - name: Build
        run: |
          if [ "${{ steps.mode.outputs.mode }}" = "selftest" ]; then
            python3 pipeline/run.py live && python3 pipeline/run.py weekly --force
          else
            python3 pipeline/run.py ${{ steps.mode.outputs.mode }}
          fi
      - name: Past seasons (year switch)
        continue-on-error: true
        run: |
          if [ ! -f archive/2025/index.html ]; then
            python3 pipeline/season_replay.py 2025 1207898992206155776
            mkdir -p archive/2025 && cp .season/2025/site/index.html archive/2025/index.html
          fi
          mkdir -p site/2025 && cp archive/2025/index.html site/2025/index.html
      - name: Live-game probe (temporary)
        if: steps.mode.outputs.mode == 'live'
        continue-on-error: true
        run: |
          W=$(python3 -c "import re;print(int(re.search(r'const G=(\d+);',open('pipeline/data_block.js').read()).group(1))+1)")
          node pipeline/probe.mjs $W
          if [ -d debug ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add debug
            if ! git diff --cached --quiet; then git commit -m "Live probe snapshot [skip ci]"; git pull --rebase --autostash origin main && git push; fi
          fi
      - name: Save season data
        if: steps.mode.outputs.mode == 'weekly' || steps.mode.outputs.mode == 'selftest' || steps.mode.outputs.mode == 'history'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/selftest
          git add -A pipeline .github
          if ! git diff --cached --quiet; then git commit -m "Weekly data refresh"; git pull --rebase -X theirs origin main; git push; fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: site }
      - id: deploy
        uses: actions/deploy-pages@v4
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
