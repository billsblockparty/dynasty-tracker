name: probe-mfl (temporary, read-only data check)
on:
  workflow_dispatch:
  push:
    branches: ['probe/mfl-datacheck-2026-11-13']
    paths: ['probe/**', '.github/workflows/probe-mfl.yml']
permissions:
  contents: read
concurrency: { group: probe-mfl, cancel-in-progress: false }
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node probe/mfl_probe.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: mfl-probe, path: probe/out, retention-days: 7 }
