name: probe-mfl (temporary, read-only data check)
# pass 2: summarises the artifact of run 43473492608 into the job log (the sandbox cannot download artifacts).
# To re-pull, run probe/mfl_probe.mjs [mfl|sleeper] (pass 1 did it; see git history of this file).
on:
  workflow_dispatch:
  push:
    branches: ['probe/mfl-datacheck-2026-11-13']
    paths: ['probe/**', '.github/workflows/probe-mfl.yml']
permissions:
  contents: read
  actions: read
concurrency: { group: probe-mfl, cancel-in-progress: false }
jobs:
  analyse:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: mfl-probe, path: art, run-id: 43473492608, github-token: '${{ secrets.GITHUB_TOKEN }}' }
      - run: du -sh art; python3 probe/analyse.py art
