name: Capture past season

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['pipeline/pull_season.mjs', '.github/workflows/season.yml']

permissions:
  contents: write

concurrency:
  group: season-capture
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Capture 2025 from Sleeper
        working-directory: pipeline
        run: node pull_season.mjs 2025 1207898992206155776
      - name: Commit
        run: |
          git config user.name "billsblockparty"; git config user.email "billsblockparty@users.noreply.github.com"
          git add pipeline/history/raw
          if ! git diff --cached --quiet; then git commit -m "Capture 2025 season raw data [skip ci]"; git pull --rebase --autostash origin main; git push; fi
