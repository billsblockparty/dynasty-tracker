<!doctype html>
<html lang="en" class="nojs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f1218">
<title>TeamHub · Official Dynasty League</title>
<style>
/*__FONTS__*/
:root{--ink:#0f1218;--deck:#161a22;--deck-2:#1c212b;--hair:#262c38;--line-strong:#353c4b;--chalk:#eef0f4;--label:#c9d2e3;--steel:#9aa3b5;--dim:#626b7c;--pylon:#ff7a1a;--sky:#7fa6ff;--win:#3fd69b;--loss:#ff5d73;--neutral-bar:#596278;
--display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;--body:"IBM Plex Sans",-apple-system,"Segoe UI",Roboto,sans-serif;--acc:#ff7a1a;--acc-a:rgba(255,122,26,.16);--gap:12px;--pad:16px}
*{box-sizing:border-box}
html{background:var(--ink);-webkit-text-size-adjust:100%}
body{margin:0;background:radial-gradient(1200px 500px at 15% -120px,var(--acc-a),transparent 70%),var(--ink);color:var(--chalk);font:400 14px/1.4 var(--body);overflow-x:hidden;min-height:100vh;transition:background .5s}
.tn{font-variant-numeric:tabular-nums lining-nums}
a{color:inherit}
/* ---------- top bar ---------- */
.top{position:sticky;top:0;z-index:20;background:rgba(15,18,24,.82);backdrop-filter:saturate(1.6) blur(18px);-webkit-backdrop-filter:saturate(1.6) blur(18px);border-bottom:1px solid var(--hair)}
.bar{display:flex;align-items:center;gap:10px;padding:8px var(--pad) 0;max-width:1680px;margin:0 auto}
.brand{font:700 19px/1 var(--display);letter-spacing:.06em;text-transform:uppercase;white-space:nowrap}
.brand i{font-style:normal;color:var(--acc);transition:color .4s}
a.brand{text-decoration:none;display:flex;align-items:center;gap:6px;min-height:44px;margin:-8px 0}.brand .bk{font:600 22px/1 var(--body);color:var(--steel);margin-top:-2px}a.brand:hover .bk{color:var(--chalk)}
.lg{font:500 12px/1.2 var(--body);color:var(--steel);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.stamp{margin-left:auto;flex:none;font:600 12px/1 var(--body);color:var(--chalk);background:var(--deck-2);border:1px solid var(--line-strong);border-radius:999px;padding:6px 10px;white-space:nowrap}
.stamp b{color:var(--acc);font-weight:600}
.sw{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:8px var(--pad) 9px;max-width:1680px;margin:0 auto;scroll-padding:0 var(--pad);-webkit-mask:linear-gradient(90deg,transparent 0,#000 var(--pad),#000 calc(100% - 24px),transparent)}
.sw::-webkit-scrollbar{display:none}
.chip{flex:none;display:flex;align-items:center;gap:7px;min-height:44px;min-width:44px;padding:0 12px 0 6px;border-radius:12px;border:1px solid var(--hair);background:var(--deck);color:var(--label);font:600 13px/1.1 var(--body);cursor:pointer;transition:border-color .25s,background .25s,color .25s;max-width:170px}
.chip img,.chip .ini{width:30px;height:30px;border-radius:50%;flex:none;background:var(--deck-2);object-fit:cover;filter:grayscale(1) brightness(.85);transition:filter .3s}
.chip span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip:hover{border-color:var(--line-strong);color:var(--chalk)}
.chip[aria-pressed=true]{border-color:var(--c);background:color-mix(in srgb,var(--c) 14%,var(--deck));color:var(--chalk)}
.chip[aria-pressed=true] img{filter:none}
.chip:focus-visible{outline:2px solid var(--c);outline-offset:2px}
@media(min-width:1024px){.sw{display:grid;grid-template-columns:repeat(5,minmax(max-content,1fr));overflow:visible;-webkit-mask:none;mask:none}.chip{max-width:none}.chip span{overflow:visible;text-overflow:clip}}
@media(min-width:1600px){.sw{grid-template-columns:repeat(10,minmax(max-content,1fr))}}
/* ---------- layout ---------- */
main{max-width:1680px;margin:0 auto;padding:var(--gap) var(--pad) 40px}
.grid{display:grid;gap:var(--gap);grid-template-columns:minmax(0,1fr)}
@media(min-width:900px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.s2,.hero{grid-column:span 2}}
@media(min-width:1280px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}.hero{grid-column:1/-1}.s2{grid-column:span 2}}
.pnl{background:linear-gradient(180deg,var(--deck-2),var(--deck) 140px);border:1px solid var(--hair);border-radius:18px;padding:16px;min-width:0;display:flex;flex-direction:column;position:relative;overflow:hidden}
.pnl::before{content:"";position:absolute;inset:0 0 auto 0;height:2px;background:linear-gradient(90deg,var(--acc),transparent 60%);opacity:.75}
.ph{display:flex;align-items:baseline;gap:8px;margin-bottom:6px}
.ph h2{margin:0;font:700 15px/1 var(--display);letter-spacing:.09em;text-transform:uppercase;color:var(--label)}
.ph .q{margin-left:auto;font:500 12px/1.2 var(--body);color:var(--steel);text-align:right}
.big{display:flex;align-items:flex-end;gap:12px;margin:2px 0 8px}
.big .n{font:700 56px/.9 var(--display);letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.big .u{min-width:0;font:600 13px/1.25 var(--body);color:var(--label);padding-bottom:4px}
.big .u small{display:block;font-weight:500;color:var(--steel);font-size:12px}
.rk{display:inline-flex;align-items:center;gap:4px;font:700 13px/1 var(--display);letter-spacing:.04em;padding:4px 7px 3px;border-radius:6px;background:var(--deck-2);border:1px solid var(--line-strong);color:var(--chalk);white-space:nowrap;font-variant-numeric:tabular-nums}
.rk.top{background:color-mix(in srgb,var(--acc) 20%,transparent);border-color:color-mix(in srgb,var(--acc) 55%,transparent)}
.up{color:var(--win)}.dn{color:var(--loss)}
.chart{position:relative;flex:1 1 auto;min-height:0}
.chart svg{display:block;width:100%;overflow:visible}
.leg{display:flex;flex-wrap:wrap;gap:4px 14px;font:500 12px/1.2 var(--body);color:var(--steel);margin-top:8px}
.leg i{display:inline-block;width:14px;height:3px;border-radius:2px;vertical-align:middle;margin-right:5px;background:var(--steel)}
/* svg text: fixed px, never viewBox-scaled (viewBox == rendered px) */
.ax{font:500 11px var(--body);fill:var(--steel)}
.axb{font:700 12px var(--display);letter-spacing:.03em}
.vl{font:700 13px var(--display);fill:var(--chalk)}
@media(min-width:768px){.ax{font-size:12px}.axb{font-size:13px}.vl{font-size:14px}}
.gl{stroke:var(--hair);stroke-width:1}
.hit{fill:transparent;cursor:crosshair}
.hit:hover+.hl,.hl.on{opacity:1}
/* ---------- hero ---------- */
.hero{padding:18px;display:grid;grid-template-columns:minmax(0,1fr);gap:14px}
@media(min-width:1280px){.hero{grid-template-columns:330px minmax(0,1fr);align-items:center}}
.id{display:flex;align-items:center;gap:14px;min-width:0}
.av{width:68px;height:68px;border-radius:50%;flex:none;box-shadow:0 0 0 2px var(--ink),0 0 0 4px var(--acc),0 8px 30px -6px var(--acc);background:var(--deck-2) center/cover;transition:box-shadow .4s}
.id h1{margin:0;font:700 31px/.95 var(--display);letter-spacing:.005em;overflow-wrap:anywhere}
.id p{margin:5px 0 0;font:500 13px/1.3 var(--body);color:var(--steel)}
.id p b{color:var(--label);font-weight:600}
.tk{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1px;background:var(--hair);border:1px solid var(--hair);border-radius:14px;overflow:hidden}
@media(min-width:640px){.tk{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(min-width:1100px){.tk{grid-template-columns:repeat(6,minmax(0,1fr))}}
.cell{background:var(--deck);padding:11px 12px 10px;min-width:0;display:flex;flex-direction:column;gap:3px}
.cell .l{font:600 11.5px/1 var(--body);letter-spacing:.07em;text-transform:uppercase;color:var(--steel)}
.cell .v{font:700 36px/.95 var(--display);font-variant-numeric:tabular-nums;white-space:nowrap}
.cell .v small{font-size:18px;color:var(--steel);font-weight:600;margin-left:2px}
.cell .s{display:flex;align-items:center;gap:6px;font:500 12px/1.2 var(--body);color:var(--label);min-height:22px;flex-wrap:wrap}
.spk{display:block;width:100%;height:26px;margin-top:2px}
.wl{display:flex;gap:3px;margin-top:4px}
.wl i{flex:1;height:18px;border-radius:4px;display:grid;place-items:center;font:700 11.5px/1 var(--display);font-style:normal;color:var(--ink)}
.wl .W{background:var(--win)}.wl .L{background:var(--loss)}.wl .T{background:var(--steel)}
/* ---------- position rows ---------- */
.pos{display:flex;flex-direction:column;gap:2px;flex:1;justify-content:space-between}
.pr{display:grid;grid-template-columns:38px 48px minmax(0,1fr) 62px;align-items:center;gap:10px;padding:7px 0;border-top:1px solid var(--hair)}
.pr:first-child{border-top:0}
.pl{font:700 15px/1 var(--display);letter-spacing:.05em;color:var(--pc)}
.pv{font:700 21px/1 var(--display);font-variant-numeric:tabular-nums;text-align:right}
.trk{position:relative;height:22px}
.trk::before{content:"";position:absolute;left:0;right:0;top:9px;height:4px;border-radius:2px;background:var(--hair)}
.trk .f{position:absolute;left:0;top:7px;height:8px;border-radius:4px;background:var(--acc);transform-origin:left;transition:transform .9s cubic-bezier(.2,.8,.2,1)}
.trk .o{position:absolute;top:3px;width:2px;height:16px;margin-left:-1px;background:#8c95a8;border-radius:1px;box-shadow:0 0 0 1px var(--deck);z-index:1}
.trk .f{z-index:0}.trk .avg{position:absolute;top:0;width:2px;height:22px;margin-left:-1px;background:var(--chalk);border-radius:1px;box-shadow:0 0 0 1.5px var(--ink);z-index:2}
.pk{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.pips{display:flex;gap:2px}.pips i{width:4px;height:4px;border-radius:50%;background:var(--line-strong)}.pips i.on{background:var(--acc);box-shadow:0 0 0 2px color-mix(in srgb,var(--acc) 30%,transparent)}
.p-QB{--pc:#f7739c}.p-RB{--pc:#3ddcc1}.p-WR{--pc:#5ec6f4}.p-TE{--pc:#fca95c}.p-K{--pc:#c491ff}.p-DEF{--pc:#c98a72}
/* ---------- game log ---------- */
.log{display:flex;flex-direction:column;flex:1;justify-content:space-between}
.gr{display:grid;grid-template-columns:30px 26px minmax(0,1fr) auto 76px;align-items:center;gap:8px;padding:6px 0;border-top:1px solid var(--hair);cursor:default}
.gr:first-child{border-top:0}
.gr .wk{font:700 13px/1 var(--display);color:var(--steel);letter-spacing:.04em}
.gr img,.gr .ini{width:26px;height:26px;border-radius:50%;filter:grayscale(1);opacity:.85;background:var(--deck-2)}
.gr .on{font:500 13px/1.2 var(--body);color:var(--label);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gr .sc{font:700 16px/1 var(--display);font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.gr .sc span{color:var(--steel);font-weight:600}.gr .sc .res{color:var(--ink);font-weight:700}
.mg{position:relative;height:26px}.mg b{position:absolute;inset:0 0 auto 0;text-align:center;font:700 13px/1 var(--display);font-variant-numeric:tabular-nums}
.mg::before{content:"";position:absolute;left:50%;top:15px;bottom:0;width:1px;background:var(--line-strong)}
.mg i{position:absolute;top:17px;height:7px;border-radius:2px}
.mg .W{background:var(--win)}.mg .L{background:var(--loss)}
.res{font:700 12px/1 var(--display);padding:3px 5px 2px;border-radius:4px;color:var(--ink);margin-right:5px}
.res.W{background:var(--win)}.res.L{background:var(--loss)}
.note{margin-top:10px;padding-top:10px;border-top:1px solid var(--hair);font:500 12.5px/1.4 var(--body);color:var(--label)}
.note b{color:var(--chalk);font-weight:600}
.note .tn{color:var(--chalk)}
.strip{margin-top:10px}
.strip .t{font:600 11.5px/1 var(--body);letter-spacing:.06em;text-transform:uppercase;color:var(--steel);margin-bottom:2px}
footer{max-width:1680px;margin:0 auto;padding:0 var(--pad) 40px;font:500 12px/1.5 var(--body);color:var(--steel)}
/* tooltip */
#tip{position:fixed;z-index:50;pointer-events:none;background:rgba(28,33,43,.97);border:1px solid var(--line-strong);border-radius:10px;padding:8px 10px;font:500 12.5px/1.35 var(--body);color:var(--label);box-shadow:0 12px 30px -8px rgba(0,0,0,.7);max-width:240px;opacity:0;transform:translateY(4px);transition:opacity .12s,transform .12s}
#tip.on{opacity:1;transform:none}
#tip b{display:block;font:700 15px/1.1 var(--display);color:var(--chalk);letter-spacing:.02em;margin-bottom:2px}
/* reveal + motion */
.js .pnl.pre{opacity:0;transform:translateY(14px)}
.pnl{transition:opacity .6s cubic-bezier(.2,.8,.2,1),transform .6s cubic-bezier(.2,.8,.2,1)}
.fade{transition:opacity .5s .6s}
.pre .fade{opacity:0}
.pre .trk .f{transform:scaleX(0)}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation:none!important}.js .pnl.pre{opacity:1;transform:none}.pre .fade{opacity:1}.pre .trk .f{transform:none}}
@media(max-width:420px){:root{--pad:12px;--gap:10px}.big .n{font-size:50px}.cell .v{font-size:32px}.pnl{padding:14px;border-radius:16px}.hero{padding:14px}.id h1{font-size:28px}.gr{grid-template-columns:26px 24px minmax(0,1fr) auto 60px;gap:6px}.lg{display:none}}
@media(max-width:340px){.cell .v{font-size:28px}.gr{grid-template-columns:24px minmax(0,1fr) auto 52px}.gr img,.gr .ini{display:none}.pr{grid-template-columns:34px 44px minmax(0,1fr) 54px;gap:8px}}
</style>
</head>
<body>
<header class="top">
  <div class="bar"><a class="brand" href="../" title="Back to the league tracker"><span class="bk">‹</span>Team<i>Hub</i></a><div class="lg" id="lg"></div><div class="stamp" id="stamp"></div></div>
  <nav class="sw" id="sw" aria-label="Team switcher"></nav>
</header>
<main><div class="grid">
  <section class="pnl hero" id="p-hero"></section>
  <section class="pnl s2" id="p-pulse"></section>
  <section class="pnl" id="p-luck"></section>
  <section class="pnl" id="p-bench"></section>
  <section class="pnl" id="p-pos"></section>
  <section class="pnl" id="p-log"></section>
</div></main>
<footer id="ft"></footer>
<div id="tip" role="status"></div>
<script id="data" type="application/json">__DATA__</script>
<script>
(()=>{
const D=JSON.parse(document.getElementById('data').textContent);
document.documentElement.className='js';
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
const T=D.teams, RIDS=Object.keys(T).map(Number).sort((a,b)=>a-b), N=RIDS.length, WK=D.weeks;
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const f1=v=>(Math.round(v*10)/10).toFixed(1), sg=(v,d=1)=>(v>0?'+':v<0?'−':'')+Math.abs(v).toFixed(d);
const ord=n=>n+(['th','st','nd','rd'][(n%100-20)%10]||['th','st','nd','rd'][n%100]||'th');
const ini=t=>esc((t.name.replace(/[^\p{L}\p{N} ]/gu,'').trim().split(/\s+/).map(w=>w[0]).join('')||'?').slice(0,2).toUpperCase());
const avImg=(t,cls='')=>t.avatar?`<img src="${esc(t.avatar)}" alt="" loading="lazy" onerror="this.replaceWith(Object.assign(document.createElement('span'),{className:'ini',textContent:'${ini(t)}'}))">`:`<span class="ini">${ini(t)}</span>`;
const rkPill=(r,lbl='')=>`<span class="rk ${r<=3?'top':''}">#${r}${lbl?` <span style="font-weight:600;color:var(--steel)">${lbl}</span>`:''}</span>`;
const luckPill=r=>`<span class="rk ${r<=3?'top':''}">${r<=N/2?ord(r)+' luckiest':ord(N+1-r)+' unluckiest'}</span>`;
const isPhone=()=>innerWidth<768;
let cur=+(new URLSearchParams(location.hash.slice(1)).get('team'))||D.default; if(!T[cur])cur=D.default;
const revealed=new Set();

/* ---------- header ---------- */
$('#lg').textContent=`${D.league.name} · ${D.league.season} · ${N} teams · 1QB · ${D.league.ppr===0.5?'Half-PPR':D.league.ppr+' PPR'}`;
$('#stamp').innerHTML=`Stats through <b>Week ${D.through}</b>`;
$('#sw').innerHTML=RIDS.map(r=>{const t=T[r];return `<button class="chip" style="--c:${t.accent}" data-r="${r}" aria-pressed="false" title="${esc(t.name)}">${avImg(t)}<span>${esc(t.name)}</span></button>`}).join('');
$('#sw').addEventListener('click',e=>{const b=e.target.closest('.chip');if(b)select(+b.dataset.r,true)});
$('#ft').innerHTML=`All figures computed from the Sleeper API (league ${esc(D.league.id)}), final weeks ${WK[0]}–${WK[WK.length-1]} only. Week ${D.nfl_week} is in progress and excluded. All-play = record if a team played all ${N-1} others every week. Expected wins = sum of weekly all-play win rate. Optimal lineup uses the league's slots (${D.league.slots.join(', ')}) and every rostered player except taxi-squad players. Built ${new Date(D.built).toLocaleString('en-US',{timeZone:'America/New_York',month:'short',day:'numeric',hour:'numeric',minute:'2-digit'})} ET. Preview build, not published.`;

/* ---------- svg helpers ---------- */
const sc=(d0,d1,r0,r1)=>v=>r0+(v-d0)/(d1-d0||1)*(r1-r0);
const P=pts=>pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join('');
function ticks(lo,hi,n){const raw=(hi-lo)/n,m=Math.pow(10,Math.floor(Math.log10(raw))),st=[1,2,2.5,5,10].map(x=>x*m).find(x=>x>=raw);const a=[];for(let v=Math.ceil(lo/st)*st;v<=hi+1e-9;v+=st)a.push(+v.toFixed(6));return a}
const tipA=(t,b)=>`data-tt="${esc(t)}" data-tb="${esc(b)}"`;
function spark(vals,{inv=false,ref=null,lo=null,hi=null}={}){if(inv){lo=Math.max(1,Math.min(...vals)-.5);hi=Math.max(...vals)+.5}const w=120,h=26,mn=lo??Math.min(...vals,ref??Infinity),mx=hi??Math.max(...vals,ref??-Infinity);const x=sc(0,vals.length-1,3,w-3),y=inv?sc(mn,mx,3,h-3):sc(mn,mx,h-3,3);
 const pts=vals.map((v,i)=>[x(i),y(v)]);const last=pts[pts.length-1];
 return `<svg class="spk" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" aria-hidden="true">${ref!=null?`<line x1="0" x2="${w}" y1="${y(ref)}" y2="${y(ref)}" stroke="var(--steel)" stroke-width="1" stroke-dasharray="2 3" vector-effect="non-scaling-stroke" opacity=".7"/>`:''}<path class="draw" d="${P(pts)}" fill="none" stroke="var(--acc)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/></svg>`}
function dotStrip(W,key,{lowGood=false,fmt=f1,label}){ // league distribution: team accent, others grey
 const h=46,pl=10,pr=10,vals=RIDS.map(r=>({r,v:key(T[r])}));const mn=Math.min(...vals.map(o=>o.v)),mx=Math.max(...vals.map(o=>o.v));
 const x=lowGood?sc(mx,mn,pl,W-pr):sc(mn,mx,pl,W-pr);const me=vals.find(o=>o.r===cur);
 let s=`<line x1="${pl}" x2="${W-pr}" y1="20" y2="20" class="gl" stroke-width="2"/>`;
 vals.filter(o=>o.r!==cur).forEach(o=>{s+=`<circle cx="${x(o.v)}" cy="20" r="5" fill="var(--neutral-bar)" stroke="var(--deck)" stroke-width="1.5"/><circle class="hit" cx="${x(o.v)}" cy="20" r="11" ${tipA(T[o.r].name,label+': '+fmt(o.v))}/>`});
 const mx_=x(me.v);s+=`<circle cx="${mx_}" cy="20" r="7.5" fill="var(--acc)" stroke="var(--ink)" stroke-width="2"/><circle class="hit" cx="${mx_}" cy="20" r="12" ${tipA(T[cur].name,label+': '+fmt(me.v))}/>`;
 const anc=mx_<50?'start':mx_>W-50?'end':'middle';
 s+=`<text class="ax" x="${pl}" y="${h-2}">${lowGood?'worse':'low'}</text><text class="ax" x="${W-pr}" y="${h-2}" text-anchor="end">${lowGood?'better':'high'}</text><text class="vl" x="${mx_}" y="7" text-anchor="${anc}" style="fill:var(--acc)">${fmt(me.v)}</text>`;
 return `<svg viewBox="0 0 ${W} ${h}" height="${h}">${s}</svg>`}

/* ---------- panels ---------- */
function hero(el){const t=T[cur],g=t.weeks;const pct=(t.apw+.5*t.apt)/(t.apw+t.apl+t.apt);
 let best=0,run=0;g.forEach(x=>{run=x.res==='W'?run+1:0;best=Math.max(best,run)});
 const med=D.league_wk.map(x=>x.med);
 el.innerHTML=`<div class="id"><div class="av" style="background-image:url('${esc(t.avatar||'')}')"></div><div style="min-width:0"><h1>${esc(t.name)}</h1><p><b>@${esc(t.owner)}</b> · ${ord(t.rank)} of ${N} · ${esc(D.league.name)}</p></div></div>
 <div class="tk">
  <div class="cell"><span class="l">Record</span><span class="v tn" data-rec="${t.w}-${t.l}${t.t?'-'+t.t:''}">${t.w}-${t.l}${t.t?'-'+t.t:''}</span><div class="wl">${g.map(x=>`<i class="${x.res}" ${tipA('Week '+x.w+' · '+x.res,f1(x.pts)+' – '+f1(x.opp_pts)+' vs '+T[x.opp].name)}>${x.res}</i>`).join('')}</div></div>
  <div class="cell"><span class="l">Standing</span><span class="v tn"><span data-c="${t.rank}" data-d="0">${t.rank}</span><small>/${N}</small></span><div class="s">${t.rank_hist.map(r=>r).join(' › ')}</div>${spark(t.rank_hist,{inv:true,lo:1,hi:N})}</div>
  <div class="cell"><span class="l">Points for</span><span class="v tn" data-c="${t.pf}" data-d="1">${f1(t.pf)}</span><div class="s">${rkPill(t.pf_rank,'PF')} <span>${f1(t.pf/g.length)}/wk</span></div>${spark(g.map(x=>x.pts),{ref:med.reduce((a,b)=>a+b,0)/med.length})}</div>
  <div class="cell"><span class="l">All-play</span><span class="v tn">${t.apw}-${t.apl}${t.apt?'-'+t.apt:''}</span><div class="s">${rkPill(t.ap_rank)} <span>.${Math.round(pct*1000).toString().padStart(3,'0')} win rate</span></div>${spark(g.map(x=>x.apw),{lo:0,hi:N-1})}</div>
  <div class="cell"><span class="l">Luck</span><span class="v tn ${t.luck>0.05?'up':t.luck<-0.05?'dn':''}" data-c="${t.luck}" data-d="2" data-s="1">${sg(t.luck,2)}</span><div class="s">${t.w+t.t*.5} W vs ${t.xw.toFixed(2)} expected</div>${spark(g.reduce((a,x)=>(a.push((a.at(-1)||0)+(x.res==='W'?1:x.res==='T'?.5:0)-x.xw),a),[]),{ref:0})}</div>
  <div class="cell"><span class="l">Streak</span><span class="v tn ${t.streak[0]==='W'?'up':'dn'}">${t.streak}</span><div class="s">Longest W${best} · last ${sg(g.at(-1).pts-g.at(-1).opp_pts)}</div>${spark(g.map(x=>x.pts-(x.opp_pts||0)),{ref:0})}</div>
 </div>`}

function pulse(el){const t=T[cur],g=t.weeks,L=D.league_wk;const W=Math.max(260,el.getBoundingClientRect().width-34),H=isPhone()?220:260;
 const pl=36,pr=46,pt=16,pb=40;const all=[...g.map(x=>x.pts),...g.map(x=>x.opp_pts||0),...L.map(x=>x.p25),...L.map(x=>x.p75)];
 const lo=Math.floor((Math.min(...all)-6)/10)*10,hi=Math.ceil((Math.max(...all)+6)/10)*10;
 const x=sc(0,g.length-1,pl+8,W-pr),y=sc(lo,hi,H-pb,pt);
 let s='';ticks(lo,hi,4).forEach(v=>{s+=`<line class="gl" x1="${pl}" x2="${W-pr+30}" y1="${y(v)}" y2="${y(v)}"/><text class="ax" x="${pl-6}" y="${y(v)+4}" text-anchor="end">${v}</text>`});
 const band=[...L.map((d,i)=>[x(i),y(d.p75)]),...L.map((d,i)=>[x(i),y(d.p25)]).reverse()];
 s+=`<path d="${P(band)}Z" fill="var(--steel)" opacity=".13"/>`;
 s+=`<path d="${P(L.map((d,i)=>[x(i),y(d.med)]))}" fill="none" stroke="var(--steel)" stroke-width="1.5" stroke-dasharray="4 4" opacity=".9"/>`;
 s+=`<path class="draw" d="${P(g.map((d,i)=>[x(i),y(d.opp_pts)]))}" fill="none" stroke="var(--label)" stroke-width="1" opacity=".2"/>`;
 const tp=g.map((d,i)=>[x(i),y(d.pts)]);
 s+=`<path class="draw fade0" d="${P(tp)}L${tp.at(-1)[0]} ${H-pb}L${tp[0][0]} ${H-pb}Z" fill="url(#pg)" opacity=".9"/>`;
 s+=`<path class="draw" d="${P(tp)}" fill="none" stroke="var(--acc)" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>`;
 g.forEach((d,i)=>{const cx=x(i),cy=y(d.pts);const op=T[d.opp];
  s+=`<g class="fade"><circle cx="${cx}" cy="${cy}" r="5.5" fill="${d.res==='W'?'var(--acc)':'var(--deck)'}" stroke="var(--acc)" stroke-width="2.5"/>
  <text class="axb" x="${cx}" y="${H-pb+19}" text-anchor="middle" style="fill:var(--steel)">W${d.w}</text>
  <text class="axb" x="${cx}" y="${H-pb+34}" text-anchor="middle" style="fill:${d.res==='W'?'var(--win)':'var(--loss)'}">${d.res}</text></g>`;
  const bw=(W-pl-pr)/g.length;
  s+=`<rect class="hit" x="${cx-bw/2}" y="${pt-10}" width="${bw}" height="${H-pt}" ${tipA(`Week ${d.w} · ${d.res} · ${ord(d.wk_rank)} of ${N}`,`${f1(d.pts)} vs ${f1(d.opp_pts)} ${op.name}\nLeague median ${f1(L[i].med)} · middle half ${f1(L[i].p25)}–${f1(L[i].p75)}`)}/>`});
 const last=tp.at(-1),my=y(L.at(-1).med),above=last[1]<=my;s+=`<text class="vl fade" x="${last[0]+10}" y="${above?Math.min(last[1]+5,my-10):Math.max(last[1]+5,my+18)}" style="fill:var(--acc)">${f1(g.at(-1).pts)}</text><text class="ax fade" x="${last[0]+10}" y="${above?Math.max(my+4,last[1]+20):Math.min(my+4,last[1]-10)}">med ${Math.round(L.at(-1).med)}</text>`;
 const avg=t.pf/g.length,lm=L.reduce((a,d)=>a+d.med,0)/L.length,ab=g.filter(d=>d.pts>L[d.w-1].med).length;
 el.innerHTML=`<div class="ph"><h2>Season pulse</h2><span class="q">${ab} of ${g.length} weeks above league median</span></div>
 <div class="big"><span class="n tn" data-c="${avg}" data-d="1">${f1(avg)}</span><span class="u">points per week<small class="${avg>=lm?'up':'dn'}">${sg(avg-lm)} vs league median week (${f1(lm)})</small></span></div>
 <div class="chart"><svg viewBox="0 0 ${W} ${H}" height="${H}"><defs><linearGradient id="pg" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="var(--acc)" stop-opacity=".22"/><stop offset="1" stop-color="var(--acc)" stop-opacity="0"/></linearGradient></defs>${s}</svg></div>
 <div class="leg"><span><i style="background:var(--acc);height:3px"></i>${esc(t.name)}</span><span><i style="background:var(--label);opacity:.3;height:1px"></i>Opponent</span><span><i style="background:repeating-linear-gradient(90deg,var(--steel) 0 4px,transparent 4px 7px)"></i>League median</span><span><i style="background:var(--steel);opacity:.3;height:9px"></i>Middle half (25–75th pct)</span><span>● win ○ loss</span></div>`}

function luck(el){const t=T[cur],g=t.weeks;const W=Math.max(240,el.getBoundingClientRect().width-34),H=isPhone()?190:200,pl=26,pr=40,pt=14,pb=26;
 const act=[0],exp=[0];g.forEach(d=>{act.push(act.at(-1)+(d.res==='W'?1:d.res==='T'?.5:0));exp.push(exp.at(-1)+d.xw)});
 const hi=Math.max(1,Math.ceil(Math.max(...act,...exp)));const x=sc(0,g.length,pl,W-pr),y=sc(0,hi,H-pb,pt);
 let s='';ticks(0,hi,4).forEach(v=>{s+=`<line class="gl" x1="${pl}" x2="${W-pr+8}" y1="${y(v)}" y2="${y(v)}"/><text class="ax" x="${pl-6}" y="${y(v)+4}" text-anchor="end">${v}</text>`});
 for(let i=0;i<g.length;i++){let a0=act[i]-exp[i],a1=act[i+1]-exp[i+1];const seg=(xa,xb,ya0,ya1,ea0,ea1,pos)=>`<path class="fade" d="M${x(xa)} ${y(ya0)}L${x(xb)} ${y(ya1)}L${x(xb)} ${y(ea1)}L${x(xa)} ${y(ea0)}Z" fill="${pos?'var(--win)':'var(--loss)'}" opacity=".22"/>`;
  if(a0*a1<0){const f=a0/(a0-a1),xm=i+f,ym=act[i]+(act[i+1]-act[i])*f;s+=seg(i,xm,act[i],ym,exp[i],ym,a0>0)+seg(xm,i+1,ym,act[i+1],ym,exp[i+1],a1>0)}
  else s+=seg(i,i+1,act[i],act[i+1],exp[i],exp[i+1],(a0+a1)>=0)}
 s+=`<path class="draw" d="${P(exp.map((v,i)=>[x(i),y(v)]))}" fill="none" stroke="var(--steel)" stroke-width="2" stroke-dasharray="5 4"/>`;
 s+=`<path class="draw" d="${P(act.map((v,i)=>[x(i),y(v)]))}" fill="none" stroke="var(--acc)" stroke-width="3" stroke-linejoin="round"/>`;
 g.forEach((d,i)=>{const cx=x(i+1);s+=`<circle class="fade" cx="${cx}" cy="${y(act[i+1])}" r="3.5" fill="var(--acc)"/><text class="ax" x="${cx}" y="${H-pb+17}" text-anchor="middle">${d.w}</text>`;
  const bw=(W-pl-pr)/g.length;s+=`<rect class="hit" x="${cx-bw/2}" y="0" width="${bw}" height="${H}" ${tipA(`Through week ${d.w}`,`Actual ${act[i+1]} W · expected ${exp[i+1].toFixed(2)}\nWeek ${d.w}: beat ${d.apw} of ${N-1} (${(d.xw).toFixed(2)} exp W), ${d.res}`)}/>`});
 s+=`<text class="vl fade" x="${x(g.length)+8}" y="${y(act.at(-1))+(act.at(-1)>=exp.at(-1)?-2:12)}" style="fill:var(--acc)">${act.at(-1)}</text><text class="vl fade" x="${x(g.length)+8}" y="${y(exp.at(-1))+(act.at(-1)>=exp.at(-1)?12:-2)}" style="fill:var(--steel)">${exp.at(-1).toFixed(1)}</text>`;
 el.innerHTML=`<div class="ph"><h2>Luck</h2><span class="q">${luckPill(t.luck_rank)}</span></div>
 <div class="big"><span class="n tn ${t.luck>0.05?'up':t.luck<-0.05?'dn':''}" data-c="${t.luck}" data-d="2" data-s="1">${sg(t.luck,2)}</span><span class="u">wins vs schedule-neutral<small>${t.w+t.t*.5} actual · ${t.xw.toFixed(2)} expected (all-play)</small></span></div>
 <div class="chart"><svg viewBox="0 0 ${W} ${H}" height="${H}">${s}</svg></div>
 <div class="leg"><span><i style="background:var(--acc)"></i>Actual wins</span><span><i style="background:repeating-linear-gradient(90deg,var(--steel) 0 5px,transparent 5px 9px)"></i>Expected</span><span><i style="background:var(--win);opacity:.5;height:9px"></i>Lucky</span><span><i style="background:var(--loss);opacity:.5;height:9px"></i>Unlucky</span></div>
 <div class="strip"><div class="t">League luck</div>${dotStrip(W,o=>o.luck,{fmt:v=>sg(v,2),label:'Luck'})}</div>`}

function bench(el){const t=T[cur],g=t.weeks;const W=Math.max(240,el.getBoundingClientRect().width-34),H=isPhone()?170:180,pl=30,pr=6,pt=20,pb=24;
 const hi=Math.ceil(Math.max(...g.map(d=>d.opt))/25)*25;const y=sc(0,hi,H-pb,pt),bw=(W-pl-pr)/g.length,cw=Math.min(34,bw*.62);
 let s='';ticks(0,hi,3).forEach(v=>{s+=`<line class="gl" x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}"/><text class="ax" x="${pl-6}" y="${y(v)+4}" text-anchor="end">${v}</text>`});
 s+=`<defs><pattern id="hz" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="5" height="5" fill="var(--deck-2)"/><line x1="0" y1="0" x2="0" y2="5" stroke="var(--steel)" stroke-width="1.6" opacity=".55"/></pattern></defs>`;
 g.forEach((d,i)=>{const cx=pl+bw*(i+.5),x0=cx-cw/2;
  s+=`<rect x="${x0}" y="${y(d.opt)}" width="${cw}" height="${y(0)-y(d.opt)}" rx="3" fill="url(#hz)" stroke="var(--line-strong)"/>`;
  s+=`<rect class="bar" x="${x0}" y="${y(d.pts)}" width="${cw}" height="${y(0)-y(d.pts)}" rx="3" fill="var(--acc)" style="transform-origin:${cx}px ${y(0)}px"/>`;
  s+=`<text class="axb fade" x="${cx}" y="${y(d.opt)-5}" text-anchor="middle" style="fill:${d.left>0.05?'var(--label)':'var(--win)'}">${d.left>0.05?'−'+Math.round(d.left):'✓'}</text><text class="ax" x="${cx}" y="${H-pb+17}" text-anchor="middle">${d.w}</text>`;
  s+=`<rect class="hit" x="${cx-bw/2}" y="0" width="${bw}" height="${H}" ${tipA(`Week ${d.w} · ${(d.eff*100).toFixed(1)}% efficient`,`Started ${f1(d.pts)} · optimal ${f1(d.opt)}\nLeft on bench ${f1(d.left)}${d.missed.length?'\nShould have started: '+d.missed.map(m=>m.n+' ('+m.pos+') '+f1(m.pts)).join(', '):''}`)}/>`});
 const worst=g.reduce((a,d)=>d.left>a.left?d:a,g[0]);
 el.innerHTML=`<div class="ph"><h2>Bench points</h2><span class="q">${rkPill(t.left_rank,'fewest left')}</span></div>
 <div class="big"><span class="n tn" data-c="${t.left}" data-d="1">${f1(t.left)}</span><span class="u">points left on bench<small>${(t.eff*100).toFixed(1)}% lineup efficiency · ${f1(t.left/g.length)}/wk</small></span></div>
 <div class="chart"><svg viewBox="0 0 ${W} ${H}" height="${H}">${s}</svg></div>
 <div class="leg"><span><i style="background:var(--acc);height:9px"></i>Started</span><span><i style="background:repeating-linear-gradient(45deg,var(--steel) 0 2px,var(--deck-2) 2px 4px);height:9px"></i>Optimal lineup gap</span></div>
 ${worst&&worst.left>0?`<div class="note">Costliest week: <b>Week ${worst.w}</b>, <span class="tn">${f1(worst.left)}</span> pts left${worst.missed.length?' · sat '+worst.missed.map(m=>`<b>${esc(m.n)}</b> <span class="tn">${f1(m.pts)}</span>`).join(', '):''}${worst.res==='L'&&worst.pts+worst.left>worst.opp_pts?' · <span class="dn">would have flipped the loss</span>':''}</div>`:''}
 <div class="strip"><div class="t">League: points left on bench</div>${dotStrip(W,o=>o.left,{lowGood:true,label:'Left on bench'})}</div>`}

function pos(el){const t=T[cur],PO=D.pos_order;
 const bestP=PO.reduce((a,p)=>t.pos[p].rank<t.pos[a].rank||(t.pos[p].rank===t.pos[a].rank&&t.pos[p].pps>t.pos[a].pps)?p:a,PO[0]);
 const top3=PO.filter(p=>t.pos[p].rank<=3).length;
 const rows=PO.map(p=>{const o=t.pos[p],vs=RIDS.map(r=>T[r].pos[p].pps),lo=Math.min(...vs),hi=Math.max(...vs),avg=D.pos_league[p].avg;
  const X=v=>(6+(hi>lo?(v-lo)/(hi-lo):1)*94); // worst = 6% stub, best = 100%
  const others=RIDS.filter(r=>r!==cur).map(r=>`<i class="o" style="left:${X(T[r].pos[p].pps)}%"></i>`).join('');
  return `<div class="pr p-${p}" ${tipA(`${p} · ${ord(o.rank)} of ${N}`,`${f1(o.pps)} pts per start (${o.starts} starts, ${f1(o.pts)} total)\nLeague avg ${f1(avg)} · best ${f1(D.pos_league[p].max)}`)}>
  <span class="pl">${p}</span><span class="pv">${f1(o.pps)}</span>
  <div class="trk">${others}<i class="f" style="width:${X(o.pps)}%"></i><i class="avg" style="left:${X(avg)}%"></i></div>
  <div class="pk">${rkPill(o.rank)}<div class="pips">${Array.from({length:N},(_,i)=>`<i class="${i+1===o.rank?'on':''}"></i>`).join('')}</div></div></div>`}).join('');
 el.innerHTML=`<div class="ph"><h2>Position strength</h2><span class="q">pts per start · rank of 10</span></div>
 <div class="big"><span class="n tn">${top3}<span style="color:var(--steel);font-size:.55em">/6</span></span><span class="u">units in the league top 3<small>Best: ${bestP} ${ord(t.pos[bestP].rank)} · flex starts count at real position</small></span></div>
 <div class="pos">${rows}</div>
 <div class="leg"><span><i style="background:var(--acc);height:8px"></i>${esc(t.name)}</span><span><i style="background:#8c95a8;width:2px;height:12px"></i>Other teams</span><span><i style="background:var(--chalk);width:2px;height:12px"></i>League avg</span><span>bar runs league worst → best</span></div>`}

function log(el){const t=T[cur],g=t.weeks;const mm=Math.max(...RIDS.flatMap(r=>T[r].weeks.map(d=>Math.abs(d.pts-d.opp_pts))));
 const avgM=g.reduce((a,d)=>a+d.pts-d.opp_pts,0)/g.length;
 const rows=g.slice().reverse().map(d=>{const o=T[d.opp],m=d.pts-d.opp_pts,w=Math.abs(m)/mm*50;
  return `<div class="gr" ${tipA(`Week ${d.w} · ${d.res} by ${f1(Math.abs(m))}`,`${f1(d.pts)} – ${f1(d.opp_pts)} vs ${o.name}\nWeekly score rank ${ord(d.wk_rank)} of ${N} · all-play ${d.apw}-${d.apl}`)}>
  <span class="wk">W${d.w}</span>${avImg(o)}<span class="on">${esc(o.name)}</span>
  <span class="sc"><span class="res ${d.res}">${d.res}</span>${f1(d.pts)}<span>–${f1(d.opp_pts)}</span></span>
  <div class="mg"><b class="${m>=0?'up':'dn'}">${sg(m)}</b><i class="${m>=0?'W':'L'}" style="${m>=0?`left:50%`:`right:50%`};width:${w}%"></i></div></div>`}).join('');
 el.innerHTML=`<div class="ph"><h2>Game log</h2><span class="q">PA ${f1(t.pa)} · ${ord(t.pa_rank)} most faced</span></div>
 <div class="big"><span class="n tn ${avgM>=0?'up':'dn'}" data-c="${avgM}" data-d="1" data-s="1">${sg(avgM)}</span><span class="u">average margin<small>${t.w}-${t.l}${t.t?'-'+t.t:''} · bars scaled to league's widest (${f1(mm)})</small></span></div>
 <div class="log">${rows}</div>`}

const PANELS={'p-hero':hero,'p-pulse':pulse,'p-luck':luck,'p-bench':bench,'p-pos':pos,'p-log':log};

/* ---------- motion ---------- */
const fmtC=(el,v)=>{const d=+el.dataset.d||0;el.textContent=el.dataset.s?sg(v,d):v.toFixed(d)};
function prep(el){if(RM)return;el.classList.add('pre');
 el.querySelectorAll('[data-c]').forEach(n=>fmtC(n,0));
 el.querySelectorAll('path.draw').forEach(p=>{if(p.getAttribute('fill')!=='none'){p.style.opacity=0;return}const L=p.getTotalLength?p.getTotalLength():0;p.style.strokeDasharray=L+' '+L;p.style.strokeDashoffset=L});
 el.querySelectorAll('rect.bar').forEach(b=>b.style.transform='scaleY(0)')}
function play(el){if(RM){el.classList.remove('pre');return}
 requestAnimationFrame(()=>{el.classList.remove('pre');
  el.querySelectorAll('path.draw').forEach((p,i)=>{p.style.transition='stroke-dashoffset 1.2s cubic-bezier(.4,.1,.2,1) .15s,opacity .8s .6s';p.style.strokeDashoffset=0;p.style.opacity=''});
  el.querySelectorAll('rect.bar').forEach((b,i)=>{b.style.transition=`transform .7s cubic-bezier(.2,.8,.2,1) ${.1+i*.06}s`;b.style.transform='scaleY(1)'});
  const ns=[...el.querySelectorAll('[data-c]')],t0=performance.now(),dur=1100;
  const step=now=>{const k=Math.min(1,(now-t0)/dur),e=1-Math.pow(1-k,3);ns.forEach(n=>fmtC(n,+n.dataset.c*e));if(k<1)requestAnimationFrame(step)};requestAnimationFrame(step)})}
const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting&&!revealed.has(e.target.id)){revealed.add(e.target.id);io.unobserve(e.target);play(e.target)}}),{threshold:.18});

function renderAll(first){for(const id in PANELS){const el=document.getElementById(id);PANELS[id](el);if(!revealed.has(id))prep(el)}
 if(first)for(const id in PANELS)io.observe(document.getElementById(id))}
function select(r,user){cur=r;const t=T[r];const ro=document.documentElement.style;ro.setProperty('--acc',t.accent);ro.setProperty('--acc-a',t.accent+'29');
 document.querySelectorAll('.chip').forEach(c=>c.setAttribute('aria-pressed',+c.dataset.r===r));
 if(user){history.replaceState(null,'','#team='+r)}
 const c=document.querySelector(`.chip[data-r="${r}"]`),sw=$('#sw');if(c&&sw.scrollWidth>sw.clientWidth)sw.scrollTo({left:c.offsetLeft-sw.clientWidth/2+c.offsetWidth/2,behavior:user&&!RM?'smooth':'auto'});
 document.title=`${t.name} · TeamHub`;renderAll(!user&&!select.done);select.done=true}
select(cur,false);
let rw=innerWidth;addEventListener('resize',()=>{clearTimeout(select.rt);select.rt=setTimeout(()=>{if(innerWidth!==rw){rw=innerWidth;for(const id of ['p-pulse','p-luck','p-bench']){const el=document.getElementById(id);PANELS[id](el);if(!revealed.has(id))prep(el)}}},120)});

/* ---------- tooltip (hover + tap) ---------- */
const tip=$('#tip');let pinned=null;
function show(n,ev){tip.innerHTML=`<b>${esc(n.dataset.tt)}</b>${esc(n.dataset.tb).replace(/\n/g,'<br>')}`;tip.classList.add('on');
 const r=tip.getBoundingClientRect(),px=ev.clientX,py=ev.clientY;let l=px+14,tp=py-r.height-14;if(l+r.width>innerWidth-8)l=Math.max(8,px-r.width-14);if(tp<70)tp=py+18;tip.style.left=l+'px';tip.style.top=tp+'px'}
const hide=()=>{tip.classList.remove('on');pinned=null};
document.addEventListener('pointermove',e=>{if(e.pointerType!=='mouse')return;const n=e.target.closest('[data-tt]');n?show(n,e):hide()});
document.addEventListener('pointerdown',e=>{if(e.pointerType==='mouse')return;const n=e.target.closest('[data-tt]');if(n&&n!==pinned){show(n,e);pinned=n}else hide()});
addEventListener('scroll',()=>{if(pinned)hide()},{passive:true});
})();
</script>
</body>
</html>
